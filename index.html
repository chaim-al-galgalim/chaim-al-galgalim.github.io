.bg::after{content:"";position:absolute;inset:0;background:rgba(239,238,233,.45)}
main{position:relative;z-index:1;max-width:420px;margin:0 auto;padding:24px 16px 28px;text-align:center}
.art{width:180px;height:180px;border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.18);display:block;margin:0 auto}
h1{font-size:20px;font-weight:700;margin-top:10px}
.sub{font-size:14px;color:#4b4b57;margin-top:4px}
.card{background:#fff;border-radius:8px;margin-top:28px;padding:0 12px;box-shadow:0 2px 10px rgba(0,0,0,.08);text-align:right}
.row{display:flex;align-items:center;justify-content:space-between;min-height:73px;padding:12px 4px;border-bottom:1px solid #e6e6ee;text-decoration:none;color:inherit;-webkit-tap-highlight-color:transparent}
h2{font-size:17px;font-weight:700;margin-top:26px;color:#2b2b33}
.card.listen{margin-top:10px}
.booking{display:flex;gap:10px;margin-top:10px}
.bk{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:8px;color:#fff;font-weight:700;font-size:16px;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.bk.wa{background:#1fa855} .bk.mail{background:#1d1d24}
.bk:active{opacity:.85}
.row:last-child{border-bottom:0}
.logo{height:40px;width:auto;max-width:150px;object-fit:contain;object-position:right center}
.logo.youtubemusic{height:34px} .logo.facebook{height:30px}
.btn{flex:none;min-width:64px;padding:11px 14px;border-radius:4px;background:#e8eaf3;font-size:14px;font-weight:700;color:#1d1d24;text-align:center;transition:background .15s}
.row:hover .btn,.row:active .btn{background:#d6d9e8}
footer{margin-top:26px;font-size:15px;font-weight:600;color:#2b2b33}
footer small{display:block;margin-top:6px;font-size:12px;font-weight:400;color:#5b5b66}
</style>
